name: Build · Release · Cleanup
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7, validate-wrappers: true }
      - run: ./gradlew test
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7, validate-wrappers: true }
      - name: Decode keystore
        run: echo "${{ secrets.ANDIKUNE_KEYSTORE_BASE64 }}" | base64 -d > andikune.keystore
      - name: Build Release
        run: ./gradlew assembleRelease --no-daemon
        env:
          ANDIKUNE_KEYSTORE_PATH: ${{ github.workspace }}/andikune.keystore
          ANDIKUNE_KEYSTORE_PASSWORD: ${{ secrets.ANDIKUNE_KEYSTORE_PASSWORD }}
          ANDIKUNE_KEY_ALIAS: ${{ secrets.ANDIKUNE_KEY_ALIAS }}
          ANDIKUNE_KEY_PASSWORD: ${{ secrets.ANDIKUNE_KEY_PASSWORD }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 3
  cleanup:
    runs-on: ubuntu-latest
    needs: [ build-release ]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: c-hive/gha-remove-artifacts@v1
        with: { age: '0 days', skip-recent: 3 }
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
