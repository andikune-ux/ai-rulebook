name: Android Build · Test · Release · Cleanup

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-test:
    name: Lint & Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate and test
        run: ./gradlew lint test --no-daemon

  build-release:
    name: Build signed Release APK
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate version
        id: version
        run: ./scripts/generate-version.sh
      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDIKUNE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDIKUNE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDIKUNE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDIKUNE_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required signing secret is missing: $name"
              exit 1
            fi
          done
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDIKUNE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/andikune.keystore"
      - name: Build Release
        env:
          ANDIKUNE_KEYSTORE_PATH: ${{ runner.temp }}/andikune.keystore
          ANDIKUNE_KEYSTORE_PASSWORD: ${{ secrets.ANDIKUNE_KEYSTORE_PASSWORD }}
          ANDIKUNE_KEY_ALIAS: ${{ secrets.ANDIKUNE_KEY_ALIAS }}
          ANDIKUNE_KEY_PASSWORD: ${{ secrets.ANDIKUNE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PversionName="${{ steps.version.outputs.version_name }}" \
            -PversionCode="${{ steps.version.outputs.version_code }}"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.tag }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 3
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/andikune.keystore"

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [ unit-test, build-release ]
    steps:
      - uses: actions/checkout@v4
      - name: Check duplicate tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists. Refusing duplicate publication."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Git tag $RELEASE_TAG already exists. Refusing duplicate publication."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: app-release-${{ needs.build-release.outputs.tag }}
          path: release-assets/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-release.outputs.tag }}
          RELEASE_NAME: ${{ needs.build-release.outputs.version_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/*.apk \
            --title "$RELEASE_TAG" \
            --notes "Android release $RELEASE_NAME"

  cleanup:
    name: Keep only latest 3 workflow artifacts
    runs-on: ubuntu-latest
    needs: [ unit-test, build-release, publish-release ]
    if: always()
    steps:
      - uses: c-hive/gha-remove-artifacts@v1
        with:
          age: '0 days'
          skip-recent: 3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
